<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E27"/>
      <stop offset="55%" stop-color="#0F1442"/>
      <stop offset="100%" stop-color="#141B52"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#3A57FF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#2743F5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2743F5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="type" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9D2FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2A3470" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <circle cx="600" cy="140" r="260" fill="url(#glow)"/>
  <circle cx="600" cy="150" r="150" fill="#2743F5" opacity="0.25" filter="url(#soft)"/>

  <!-- extruded / 3D wordmark: stacked offset layers front to back -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="150" text-anchor="middle">
    <text x="604" y="196" fill="#060815">Sift</text>
    <text x="602" y="194" fill="#0C1030">Sift</text>
    <text x="600" y="192" fill="#141B52">Sift</text>
    <text x="598" y="190" fill="#1C2570">Sift</text>
    <text x="596" y="188" fill="#25309A">Sift</text>
    <text x="594" y="186" fill="#2743F5">Sift</text>
    <text x="592" y="184" fill="url(#type)" letter-spacing="-3">Sift</text>
  </g>

  <text x="600" y="240" text-anchor="middle" font-family="Consolas, 'IBM Plex Mono', monospace" font-size="17" letter-spacing="3" fill="#8A93D6">GOOGLE, STRAIGHT THROUGH.</text>

  <g font-family="Consolas, 'IBM Plex Mono', monospace" font-size="13" fill="#6672B8">
    <text x="600" y="278" text-anchor="middle">realtime results  ·  answer box  ·  knowledge panel  ·  images · news · videos</text>
  </g>

  <line x1="440" y1="298" x2="760" y2="298" stroke="#2A3470" stroke-width="1"/>
</svg>
